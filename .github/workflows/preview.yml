name: Preview

# Deploys a pull request's preview after its Pull Request run succeeds. That
# run's Preview Build job builds the pull request with no secrets and uploads
# it. `workflow_run` runs main's copy of this workflow and of
# preview_deploy.yml, which treat the build as data, so no pull request code
# runs where the Cloudflare token or the preview secrets are.
on: # zizmor: ignore[dangerous-triggers] Runs only main's code, for branches of this repository, after authorizing the triggering actor.
  workflow_run:
    workflows: [Pull Request]
    types: [completed]

permissions: {}

jobs:
  authorize:
    name: Authorize
    # Pull requests from forks get no preview: their Pull Request run builds none.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Mint organization membership token
        id: member_token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: workflow-member

      - name: Check triggering actor organization membership
        env:
          ACTOR: ${{ github.run_attempt != '1' && github.triggering_actor || github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ steps.member_token.outputs.token }}
        run: gh api --silent "orgs/tempoxyz/members/${ACTOR}"

      # Only an open, ready pull request of this repository whose head is the
      # run's commit gets a preview.
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          NUMBER=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
            --jq "map(select(.state == \"open\" and .draft == false and .head.repo.full_name == \"${GITHUB_REPOSITORY}\" and .head.sha == \"${HEAD_SHA}\")) | first | .number // empty")
          if [ -z "$NUMBER" ]; then
            echo "No open, ready pull request found for ${HEAD_SHA}."
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview
    needs: authorize
    permissions:
      # Downloads the Pull Request run's preview build.
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/preview_deploy.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      pr_number: ${{ needs.authorize.outputs.pr_number }}
      run_id: ${{ github.event.workflow_run.id }}
      sha: ${{ github.event.workflow_run.head_sha }}
      twitter_bot_handle: ${{ vars.TWITTER_BOT_HANDLE || 'tipbotgg' }}
    secrets:
      FEE_PAYER_PRIVATE_KEY_MAINNET: ${{ secrets.FEE_PAYER_PRIVATE_KEY_MAINNET }}
      FEE_PAYER_PRIVATE_KEY_TESTNET: ${{ secrets.FEE_PAYER_PRIVATE_KEY_TESTNET }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SLACK_CONFIG_ACCESS_TOKEN: ${{ secrets.SLACK_CONFIG_ACCESS_TOKEN }}
      SLACK_CONFIG_REFRESH_TOKEN: ${{ secrets.SLACK_CONFIG_REFRESH_TOKEN }}
      TEMPO_API_KEY: ${{ secrets.TEMPO_API_KEY }}
