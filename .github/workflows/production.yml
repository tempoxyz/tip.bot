name: Production

on:
  push:
    branches: [main]

permissions: {}

# One run at a time, in push order, never cancelled: the broker finishes work a
# cancelled job started, so overlapping runs could deploy out of order. GitHub
# keeps only the newest pending run, so main's latest commit deploys last.
concurrency:
  group: production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: false

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Mint organization membership token
        id: member_token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: workflow-member

      - name: Check triggering actor organization membership
        env:
          ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ steps.member_token.outputs.token }}
        run: gh api --silent "orgs/tempoxyz/members/${ACTOR}"

  check:
    name: Check
    needs: authorize
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

  # The build reads the production Slack app ID, a GitHub environment variable,
  # which only a job in that environment can see. It is public: tip.bot serves
  # it in a meta tag.
  settings:
    name: Settings
    needs: authorize
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    outputs:
      slack_app_id: ${{ steps.slack_app_id.outputs.value }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Read the Slack app ID
        id: slack_app_id
        env:
          SLACK_APP_ID: ${{ vars.SLACK_APP_ID }}
        run: |
          if [[ ! "$SLACK_APP_ID" =~ ^A[0-9A-Z]{6,32}$ ]]; then
            echo "::error::The production environment's SLACK_APP_ID is not a Slack app ID."
            exit 1
          fi
          echo "value=${SLACK_APP_ID}" >> "$GITHUB_OUTPUT"

  # Builds and attests the Worker, its chunks, static assets, configuration and
  # D1 migrations without any Cloudflare credential. The deploy job hands the
  # artifact to the Cloudflare Deploy Broker, whose tipbot authorization admits
  # only this workflow on main, in the production environment.
  build:
    name: Build
    needs: [check, settings]
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: tempoxyz/gh-actions/.github/workflows/cloudflare-deploy-broker-build.yml@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
    with:
      build-command: SLACK_APP_ID=${{ needs.settings.outputs.slack_app_id }} pnpm build:broker
      wrangler-config: dist/server/wrangler.json
      d1-migrations-directory: db/migrations
      artifact-name: tipbot

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # The broker applies pending D1 migrations to DB, then uploads and
      # promotes the version, and stops before promotion if a migration fails.
      # The Worker keeps its secrets; change them in the broker dashboard
      # (https://cf.tehq.net/, Workers tab).
      - name: Migrate D1 and deploy through the broker
        uses: tempoxyz/gh-actions/actions/cloudflare-deploy-broker@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          deployment-id: tipbot
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          archive-digest: ${{ needs.build.outputs.archive-digest }}
          module-digest: ${{ needs.build.outputs.module-digest }}

      # /api/health queries D1.
      - name: Check https://tip.bot
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS --max-time 10 https://tip.bot/api/health; then exit 0; fi
            sleep 6 # 6 seconds
          done
          echo "::error::https://tip.bot/api/health did not return 200."
          exit 1

  update_slack_app:
    name: Update Slack App
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: slack-config-ci
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Setup Slack config token
        id: slack_token
        uses: ./.github/actions/setup-slack-config-token # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          slack-config-refresh-token: ${{ secrets.SLACK_CONFIG_REFRESH_TOKEN }}
          slack-config-access-token: ${{ secrets.SLACK_CONFIG_ACCESS_TOKEN }}

      - name: Update Slack production app
        env:
          SLACK_APP_ID: ${{ vars.SLACK_APP_ID }}
          SLACK_CONFIG_ACCESS_TOKEN: ${{ steps.slack_token.outputs.token }}
        run: pnpm slack:app update production tip.bot "$SLACK_APP_ID"
