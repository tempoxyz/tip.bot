name: Preview Sweep

# Deletes previews whose pull request is closed or a draft but whose cleanup
# failed or never ran: their Slack apps, then their Worker, D1 database and
# queues in the production account, with a short-lived Cloudflare STS token
# (policy `preview-sweep`).
on:
  repository_dispatch:
    types: [preview_sweep]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

concurrency:
  group: slack-config-ci
  cancel-in-progress: false

permissions: {}

env:
  WRANGLER_SEND_METRICS: false

jobs:
  authorize:
    name: Authorize
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Mint organization membership token
        id: member_token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: workflow-member

      - name: Check triggering actor organization membership
        env:
          ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ steps.member_token.outputs.token }}
        run: gh api --silent "orgs/tempoxyz/members/${ACTOR}"

  sweep:
    name: Sweep Orphaned Previews
    if: always() && (github.event_name == 'schedule' || needs.authorize.result == 'success')
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Slack config token
        id: slack_token
        continue-on-error: true
        uses: ./.github/actions/setup-slack-config-token # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          slack-config-refresh-token: ${{ secrets.SLACK_CONFIG_REFRESH_TOKEN }}
          slack-config-access-token: ${{ secrets.SLACK_CONFIG_ACCESS_TOKEN }}

      # Cloudflare STS mints the token under tip.bot's `preview-sweep` policy,
      # which admits only this job of main's preview_sweep.yml, on its schedule
      # or a repository dispatch, in the preview environment. It serves only
      # this runner's IP address, and STS revokes it when the job ends.
      - name: Fetch a Cloudflare token
        id: cloudflare
        uses: tempoxyz/gh-actions/actions/cloudflare-sts@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          account: prd
          policy: preview-sweep
          ttl: 15m

      - name: Sweep orphaned previews
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account-id }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          SLACK_CONFIG_ACCESS_TOKEN: ${{ steps.slack_token.outputs.token }}
        run: |
          if [ -z "$SLACK_CONFIG_ACCESS_TOKEN" ]; then
            echo "Slack config token unavailable; skipping Slack app cleanup."
          fi
          WORKERS=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            | jq -r '.result[].id // empty' | grep '^tipbot-pr[0-9][0-9]*$' || true)
          # shellcheck disable=SC2001
          WORKER_PR_NUMBERS=$(echo "$WORKERS" | sed 's/^tipbot-pr//' || true)
          # Preview databases are found by name, never by the ID in a comment.
          D1_DATABASES=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=tipbot-pr" \
            | jq -c '[.result[] | select(.name | test("^tipbot-pr[0-9]+$")) | {name, uuid}]' || echo '[]')
          D1_PR_NUMBERS=$(echo "$D1_DATABASES" | jq -r '.[].name | ltrimstr("tipbot-pr")')
          QUEUE_PR_NUMBERS=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" \
            | jq -r '.result[].queue_name // empty' \
            | sed -n 's/^tipbot-pending-tip-pr\([0-9][0-9]*\)\(-dlq\)\?$/\1/p' || true)
          COMMENT_PR_NUMBERS=$(gh api "repos/${{ github.repository }}/issues/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("tipbot-preview"))) | .issue_url | split("/")[-1]' \
            2>/dev/null || true)
          PR_NUMBERS=$(printf '%s\n%s\n%s\n%s\n' "$WORKER_PR_NUMBERS" "$D1_PR_NUMBERS" "$QUEUE_PR_NUMBERS" "$COMMENT_PR_NUMBERS" | grep '^[0-9][0-9]*$' | sort -n -u || true)
          for PR_NUMBER in $PR_NUMBERS; do
            worker="tipbot-pr${PR_NUMBER}"
            PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '{state: .state, draft: .draft}' 2>/dev/null || echo '{"state":"unknown","draft":false}')
            STATE=$(echo "$PR_JSON" | jq -r '.state')
            DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
            if [ "$STATE" = "open" ] && [ "$DRAFT" != "true" ]; then
              echo "Keeping ${worker}; PR ${PR_NUMBER} is open."
              continue
            fi

            BODY=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate --slurp 2>/dev/null | jq -r 'map(.[] | select(.user.login == "github-actions[bot]" and (.body | contains("tipbot-preview")))) | first | .body // ""' || true)
            META=$(node -e 'const body = process.argv[1] || ""; const match = body.match(/<!-- tipbot-preview: (.*?) -->/); console.log(match?.[1] ?? "{}")' "$BODY")
            SLACK_APP_IDS=$(echo "$META" | jq -c '[((.slack_app_ids // [])[]), (.slack_app_id // empty)] | map(select(. != "")) | unique')

            if [ -n "$SLACK_CONFIG_ACCESS_TOKEN" ] && [ "$SLACK_APP_IDS" != "[]" ]; then
              set -euo pipefail
              FAILED=0
              while read -r SLACK_APP_ID; do
                RESPONSE=$(curl -fsS -X POST https://slack.com/api/apps.manifest.delete \
                  -H "Authorization: Bearer ${SLACK_CONFIG_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json; charset=utf-8" \
                  -d "{\"app_id\":\"${SLACK_APP_ID}\"}" || echo '{"ok":false,"error":"request_failed"}')
                OK=$(echo "$RESPONSE" | jq -r '.ok // false')
                ERROR=$(echo "$RESPONSE" | jq -r '.error // empty')
                if [ "$OK" != "true" ] && [ "$ERROR" != "app_not_found" ] && [ "$ERROR" != "invalid_app_id" ]; then
                  echo "$RESPONSE" | jq '{ok,error,errors}'
                  FAILED=1
                fi
              done < <(echo "$SLACK_APP_IDS" | jq -r '.[]')
              if [ "$FAILED" != "0" ]; then echo "Slack app cleanup failed; continuing preview cleanup."; fi
            fi
            QUEUE_IDS=$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" \
              | jq -r --arg prefix "-pr${PR_NUMBER}" '.result[] | select(.queue_name | test($prefix + "(-dlq)?$")) | .queue_id')
            for QUEUE_ID in $QUEUE_IDS; do
              CONSUMER_ID=$(curl -fsS \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/consumers" \
                | jq -r --arg name "$worker" '.result[] | select(.script == $name) | .consumer_id // empty')
              if [ -n "$CONSUMER_ID" ]; then
                curl -fsS -X DELETE \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/consumers/${CONSUMER_ID}" \
                  || true
              fi
            done
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -F 'settings={"bindings":[]};type=application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings" \
              || true
            curl -fsS -X DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}?force=true" \
              || true
            for D1_ID in $(echo "$D1_DATABASES" | jq -r --arg name "$worker" '.[] | select(.name == $name) | .uuid'); do
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_ID}" \
                || true
            done
            for QUEUE_ID in $QUEUE_IDS; do
              curl -fsS -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}" \
                || true
            done

            SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha // empty' 2>/dev/null || true)
            SHA_SHORT=$(echo "$SHA" | cut -c1-7)
            UPDATED=$(date -u +"%b %-d, %Y, %-I:%M %p")
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            BODY=$(printf '%s\n\n%s\n%s\n%s' \
              "The latest Tipbot preview deployment for ${SHA_SHORT}" \
              "| Name | Status | Preview | Updated (UTC) |" \
              "| :--- | :----- | :------ | :------------ |" \
              "| pr${PR_NUMBER} | [![Shut Down](https://vercel.com/static/status/canceled.svg) Shut Down](${RUN_URL}) | [pr${PR_NUMBER}.tip.bot](https://pr${PR_NUMBER}.tip.bot) | ${UPDATED} |")
            COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("tipbot-preview") or contains("Tipbot preview deployment"))) | .id' | head -1)
            if [ -n "$COMMENT_ID" ]; then
              gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY"
            fi
          done
